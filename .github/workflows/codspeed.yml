name: CodSpeed

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.gitignore'
  push:
    branches:
      - master
  workflow_dispatch:

env:
  UV_VERSION: 0.13.5

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup install --profile minimal
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: ${{ github.workflow }}
          prune-cache: true
      - run: uv sync --frozen --config-setting build-args=--profile=benchmark
      - uses: CodSpeedHQ/action@v5.5.0
        with:
          mode: simulation,memory
          exclude-allocations: true
          run: uv run --no-sync pytest --codspeed benchmarks
